name: Update and deploy Vitaregis

on:
  schedule:
    - cron: "0 11 * * *"     # daily, 11:00 UTC
  workflow_dispatch: {}       # "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh data
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/update.py
      - name: Commit updated data
        run: |
          git config user.name "vitaregis-bot"
          git config user.email "vitaregis-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Update data $(date -u +%F)"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
